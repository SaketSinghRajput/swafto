# THE PIPELINE.
#
# WHY A DATABASE SERVICE IS THE FIRST THING HERE. Two suites in this repository -
# the rate limiter and the Postgres schema guards - skip themselves when no
# database is listening, and they have been skipping on every developer machine
# since they were written. A suite that usually skips is a suite nobody is
# watching, and the append-only triggers and the closed-day guard are exactly the
# rules that must not quietly stop working. CI is where they always run.
#
# THE GATES ARE THE REPOSITORY'S OWN. This file invents no quality bar. It runs
# `check:all` - every check:* script, which already fails the build locally - plus the
# test suite, the golden vectors on both runtimes, and the planted-defect proof. A
# pipeline with its own weaker rules is a second opinion nobody asked for.
#
# `--prove` RUNS IN CI ON PURPOSE. It plants a real defect in each verifier and
# requires the verifier to fail. It is the only step that can catch an instrument
# which has quietly stopped instrumenting, and this build has now found four of
# those - two of them only because the prove harness itself was repaired.

name: ci

on:
  push:
    # `productionize` is the long-running hardening branch; it gets the same gate.
    branches: [master, main, productionize]
  pull_request:

# A run that has been superseded is a run nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A workflow that can write to the repository is a supply
# chain risk with no upside for a check suite.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swafto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway credential for a throwaway container. Nothing here is secret,
      # and check:secrets reads this file like every other. The suites apply their
      # own migrations from spec.ts - migrationDown then migrationUp - so there is
      # no schema step here, and no second copy of the schema to drift from it.
      # tools/pg-up.mjs is NOT used: it starts its own Docker container on another
      # port, which is right for a laptop and wrong beside a service container.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/swafto_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, because the secret scan below reads every commit and
          # a credential deleted in a later commit is still a leaked credential.
          fetch-depth: 0

      # Third-party secret scanner over the whole git history, complementing the
      # in-repo check:secrets (which reads only the working tree). The binary is
      # downloaded at a pinned version and verified against its published
      # sha256 before it runs. It is gitleaks' own release, no paid service and
      # no licence key (the gitleaks-action wrapper needs one for organisations).
      # Allowlist and its reason: .github/gitleaks.toml.
      - name: Scan git history for secrets
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz             https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/gitleaks && tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks git --config .github/gitleaks.toml --redact --no-banner --exit-code 1 .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The engines field says >=24 <25. CI honours it rather than guessing.
          node-version: '24'
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci

      # check:layout measures a real layout in a real engine, so it needs a real
      # browser. Chromium only: the product ships to Android, and the question is
      # whether Odia text fits, not whether three engines agree with each other.
      - name: Install the browser the layout check measures in
        run: npx playwright install --with-deps chromium

      # Everything below fails the build. None of it warns.
      - name: check:all
        run: npm run check:all

      - name: The whole test suite
        run: npx vitest run

      # The golden vectors on both runtimes and their divergence are NOT a separate
      # step: check:all above already runs check:divergence, which runs
      # test:vectors:node, test:vectors:hermes and test:vectors:diff. A separate
      # step ran the same three commands again (SIMP-05).

      # B33. High and critical only: a moderate advisory in build tooling is
      # something to fix on a Tuesday, not something to block a release on.
      - name: Dependency advisories
        run: npm audit --audit-level=high

      - name: Prove every verifier still fails on a planted defect
        run: npm run prove:verifiers

      - name: Coverage
        run: npm run coverage

      # THE COVERAGE GATE FOR BUSINESS LOGIC (PLAN 4.1). Each path is gated on its
      # own tests, so a well-covered engine cannot carry an untested API.
      #
      # ENGINE. B3 in BENCHMARKS.md (SHA-locked, untouched) asks for 100% branch.
      # The engine measures 91.91% today, so B3 is a MISS that stays reported by
      # `npm run coverage` above; it is not gated here because a gate at 100 would
      # redden every build for a known, recorded gap. This gate is the 80% floor,
      # which exists to stop a REGRESSION and is not a claim that B3 is met.
      - name: Coverage gate - engine (80%)
        run: >-
          npx vitest run packages/formula-engine
          --coverage.enabled --coverage.provider=v8
          --coverage.include='packages/formula-engine/src/**'
          --coverage.reporter=text-summary
          --coverage.thresholds.statements=80 --coverage.thresholds.branches=80
          --coverage.thresholds.functions=80 --coverage.thresholds.lines=80

      # API and MOBILE own their exact commands. Until they report them, these use
      # the paths named in docs/audit/PLAN.md 4.1 (API: apps/api/src; mobile: store
      # and app). Replace the include lines with theirs if they differ.
      - name: Coverage gate - API (80%)
        run: >-
          npx vitest run apps/api
          --coverage.enabled --coverage.provider=v8
          --coverage.include='apps/api/src/**'
          --coverage.reporter=text-summary
          --coverage.thresholds.statements=80 --coverage.thresholds.branches=80
          --coverage.thresholds.functions=80 --coverage.thresholds.lines=80

      # MOBILE's command, from MOBILE via the CTO. It runs the WHOLE suite on purpose:
      # the root test/*.spec.tsx exercise mobile code, so a mobile-only run would
      # under-measure it. Measured when set: 91.29% lines, 86.80% branches.
      - name: Coverage gate - mobile store, app, net, host (80% lines and branches)
        run: >-
          npx vitest run
          --coverage.enabled --coverage.provider=v8
          --coverage.include='apps/mobile/src/{store,app,net}/**'
          --coverage.include='apps/mobile/src/host.tsx'
          --coverage.reporter=text-summary --coverage.reportOnFailure=true
          --coverage.thresholds.lines=80 --coverage.thresholds.branches=80

      # The API's generated docs must match the routes. Script names are the ones
      # API was asked to provide (gen:openapi, check:config-docs); if either is
      # missing from package.json these two steps fail loudly rather than skip.
      - name: OpenAPI is current
        run: npm run gen:openapi -- --check

      - name: Config docs agree with config.ts
        run: npm run check:config-docs

      # Kept because the contact sheet is the only artifact a human can judge by
      # looking, and the Odia rendering question is answered by looking.
      - name: Contact sheet
        run: npm run shots

      - name: Keep what a human needs to read
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            reports/
            docs/contact-sheet/
          retention-days: 14
